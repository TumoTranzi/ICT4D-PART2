{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:0 auto;">
  <h1>Sign in</h1>
  <p>Citizen reporting is public and needs no login. Partner and administrator areas require a staff account.</p>
  <form method="post">
    <label for="username">Username</label>
    <div class="field-with-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-5 5-7 8-7s7 2 8 7"></path></svg>
      <input id="username" name="username" type="text" autocomplete="username" required>
    </div>

    <label for="password">Password</label>
    <div class="field-with-icon">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-5 5-7 8-7s7 2 8 7"></path></svg>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-block">Sign in</button>
  </form>
</div>

<div class="card" style="max-width:480px;margin:1rem auto;">
  <h2>Demo accounts</h2>
  <table>
    <thead><tr><th>Role</th><th>Username</th><th>Password</th></tr></thead>
    <tbody>
      <tr><td>Partner</td><td>partner</td><td>partner123</td></tr>
      <tr><td>Admin</td><td>admin</td><td>admin123</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
