services:
  - type: web
    name: ttsebisa
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    disk:
      name: ttsebisa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TSEBISA_ENV
        value: production
      - key: TSEBISA_DATA_DIR
        value: /var/data
      - key: TSEBISA_SECRET_KEY
        generateValue: true
      - key: TSEBISA_ADMIN_PASSWORD
        sync: false
