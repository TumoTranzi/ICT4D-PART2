services:
  - type: web
    name: ttsebisa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: TSEBISA_ENV
        value: production
      - key: TSEBISA_DATA_DIR
        value: /tmp/ttsebisa-data
      - key: TSEBISA_SECRET_KEY
        generateValue: true
      - key: TSEBISA_ADMIN_PASSWORD
        sync: false
